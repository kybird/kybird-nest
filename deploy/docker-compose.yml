# kybird-nest 서버.
#
# **리버스 프록시를 포함하지 않는다.** 이 머신에서 다른 서비스가 이미
# 80/443 을 쓰고 있으므로, 여기서 또 띄우면 충돌한다. 앱은 로컬 포트만 열고
# 기존 프록시가 vhost 를 하나 더 잡아주면 된다 (docs/deploy.md 참고).

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: kybird-nest:latest
    restart: unless-stopped

    # 127.0.0.1 에만 묶는다. 0.0.0.0 으로 열면 방화벽 설정과 무관하게
    # 공인 IP:3000 으로 직접 붙을 수 있어 프록시의 TLS 를 우회한다.
    ports:
      - "127.0.0.1:${KNEST_PORT:-3000}:3000"

    environment:
      DATABASE_URL: "file:/data/kybird-nest.db"

      # 가입 초대 코드. **비워두면 가입이 완전히 닫힌다.**
      KNEST_INVITE_CODE: "${KNEST_INVITE_CODE:-}"

      # 프록시가 TLS 를 끊고 앱에는 평문으로 넘기므로, 앱은 자기가 HTTPS
      # 뒤에 있는지 모른다. 명시적으로 켜준다.
      KNEST_COOKIE_SECURE: "${KNEST_COOKIE_SECURE:-1}"

      # 레이트 리밋이 X-Forwarded-For 의 마지막 값을 클라이언트로 본다.
      # 프록시가 없는데 켜면 헤더 위조로 우회당한다.
      KNEST_TRUST_PROXY: "${KNEST_TRUST_PROXY:-1}"

    volumes:
      - kybird-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # 하루 한 번 스냅샷을 뜨고 오래된 건 지운다.
  #
  # WAL 모드라 .db 파일만 복사하면 최근 쓰기가 빠진 사본이 나온다.
  # sqlite3 의 .backup 은 서버가 돌고 있는 중에도 일관된 사본을 만든다.
  backup:
    image: kybird-nest:latest
    restart: unless-stopped
    depends_on:
      - server
    entrypoint: ["/bin/sh", "/backup/backup-loop.sh"]
    environment:
      KNEST_BACKUP_KEEP: "${KNEST_BACKUP_KEEP:-14}"
      KNEST_BACKUP_INTERVAL: "${KNEST_BACKUP_INTERVAL:-86400}"
    volumes:
      - kybird-data:/data
      - kybird-backups:/backups
      - ./docker/backup-loop.sh:/backup/backup-loop.sh:ro

volumes:
  kybird-data:
  kybird-backups:
